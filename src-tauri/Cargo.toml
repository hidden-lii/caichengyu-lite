[package]
name = "caichengyu-lite"
version = "0.1.0"
description = "猜成语（精简版）"
authors = ["aki"]
license = "MIT"
edition = "2024"
rust-version = "1.99"

[lib]
name = "caichengyu_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# devtools：发布版里也允许 F12 / 右键「检查」打开开发者工具，Windows 上出现白屏之类的问题时能直接看控制台。
# 定位完问题、不需要时可以去掉。
tauri = { version = "=2.12.4", features = ["devtools"] }
tauri-plugin-clipboard-manager = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
